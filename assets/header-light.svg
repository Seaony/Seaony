<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="260" viewBox="0 0 1000 260" role="img" aria-label="Hi, I’m Seaony. I build quiet, native apps for the Mac, and the web services behind them.">
  <style>
    .sans { font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "Segoe UI", "Helvetica Neue", Helvetica, Arial, sans-serif; }
    .mono { font-family: "SF Mono", ui-monospace, Menlo, Consolas, "Liberation Mono", monospace; }
  </style>
  <rect x="0.5" y="0.5" width="999" height="259" rx="20" fill="#fafafa" stroke="#e5e5e5"/>

  <text x="56" y="80" class="mono" font-size="18" fill="#FA7343">~/seaony</text>
  <text x="56" y="142" class="sans" font-size="52" font-weight="700" letter-spacing="-1" fill="#111111">Hi, I’m Seaony<tspan fill="#FA7343">.</tspan></text>
  <text x="56" y="186" class="sans" font-size="22" fill="#525252">I build quiet, native apps for the Mac,</text>
  <text x="56" y="216" class="sans" font-size="22" fill="#525252">and the web services behind them.</text>

  <g transform="translate(624 46)">
    <rect x="0.5" y="0.5" width="319" height="167" rx="12" fill="#ffffff" stroke="#e5e5e5"/>
    <circle cx="22" cy="18" r="5.5" fill="#ff5f57"/>
    <circle cx="40" cy="18" r="5.5" fill="#febc2e"/>
    <circle cx="58" cy="18" r="5.5" fill="#28c840"/>
    <line x1="1" y1="36" x2="319" y2="36" stroke="#eeeeee"/>
    <g class="mono" font-size="14" fill="#111111">
      <text x="22" y="72"><tspan fill="#FA7343">struct</tspan> Seaony {</text>
      <text x="39" y="98"><tspan fill="#FA7343">let</tspan> city = <tspan fill="#737373">"Hangzhou"</tspan></text>
      <text x="39" y="124"><tspan fill="#FA7343">let</tspan> loves = [<tspan fill="#737373">"Swift"</tspan>, <tspan fill="#737373">"TS"</tspan>]</text>
      <text x="22" y="150">}</text>
    </g>
  </g>
</svg>
